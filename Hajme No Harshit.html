<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <style>
        :root {
            --background-image-link: url('https://24.media.tumblr.com/15d7db127eeafe49c5a02c2a295eae72/tumblr_mjae7mtsPd1rek7mwo1_500.gif');
        }
        body {
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: var(--background-image-link) no-repeat center center fixed;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: rgba(255,255,255,0.92);
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.25);
            padding: 36px 28px 28px 28px;
            min-width: 340px;
            max-width: 95vw;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-30px);}
            to { opacity: 1; transform: translateY(0);}
        }
        h2 {
            text-align: center;
            color: #3b5998;
            margin-bottom: 18px;
            letter-spacing: 1px;
        }
        .add-course {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .add-course input {
            flex: 1;
            padding: 10px;
            border-radius: 7px;
            border: 1px solid #b2bec3;
            font-size: 1rem;
            transition: box-shadow 0.2s;
        }
        .add-course input:focus {
            outline: none;
            box-shadow: 0 0 0 2px #a5d8ff;
        }
        .add-course button {
            padding: 10px 18px;
            border: none;
            border-radius: 7px;
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: #fff;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }
        .add-course button:hover {
            background: linear-gradient(90deg, #182848 0%, #4b6cb7 100%);
            transform: scale(1.05);
        }
        ul.course-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.course-list li {
            background: #f0f4f8;
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 1.05rem;
            box-shadow: 0 2px 8px rgba(76, 201, 240, 0.08);
            animation: slideIn 0.4s;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px);}
            to { opacity: 1; transform: translateX(0);}
        }
        .remove-btn {
            background: none;
            border: none;
            color: #e17055;
            font-size: 1.3rem;
            cursor: pointer;
            margin-left: 12px;
            transition: color 0.2s, transform 0.2s;
        }
        .remove-btn:hover {
            color: #d63031;
            transform: scale(1.2) rotate(10deg);
        }
        @media (max-width: 500px) {
            .container {
                padding: 18px 6vw;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div id="timer" style="width:100vw;text-align:center;font-size:1.3rem;font-weight:bold;color:#222;background:rgba(255,255,255,0.7);padding:16px 0 8px 0;letter-spacing:1px;position:fixed;top:0;left:0;z-index:10;">
        Loading timer...
    </div>
    <div style="display: flex; gap: 32px; justify-content: center; align-items: flex-start; width: 100vw; margin-top:64px;">
        <!-- Main Courses Container -->
        <div class="container" style="opacity: 1; min-width:340px; flex:1;">
            <h2>Courses</h2>
            <div class="add-course">
                <input type="text" id="courseNameInput" placeholder="Course name..." />
                <input type="text" id="courseLinkInput" placeholder="Course link (https://...)" />
                <button id="addBtn">Add</button>
            </div>
            <ul class="course-list" id="courseList"></ul>
        </div>
        <!-- Completed Courses Container -->
        <div class="container" style="opacity: 1; min-width:260px; flex:0.7;">
            <h2>Completed</h2>
            <ul class="course-list" id="completedList"></ul>
        </div>
    </div>
    <script>
        // Timer till 8 months from now
        function updateTimer() {
            const timerDiv = document.getElementById('timer');
            // Set the target date to 8 months from first visit (or now if not set)
            let start = localStorage.getItem('eightMonthStart');
            if (!start) {
                start = Date.now();
                localStorage.setItem('eightMonthStart', start);
            }
            const target = new Date(Number(start));
            target.setMonth(target.getMonth() + 8);

            const now = new Date();
            let diff = target - now;
            if (diff < 0) {
                timerDiv.textContent = "8 months have passed!";
                return;
            }
            const months = Math.floor(diff / (1000 * 60 * 60 * 24 * 30.4375));
            diff -= months * (1000 * 60 * 60 * 24 * 30.4375);
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            diff -= days * (1000 * 60 * 60 * 24);
            const hours = Math.floor(diff / (1000 * 60 * 60));
            diff -= hours * (1000 * 60 * 60);
            const minutes = Math.floor(diff / (1000 * 60));
            diff -= minutes * (1000 * 60);
            const seconds = Math.floor(diff / 1000);

            timerDiv.textContent = `Time left: ${months} months, ${days} days, ${hours} hours, ${minutes} minutes, ${seconds} seconds`;
        }
        updateTimer();
        setInterval(updateTimer, 1000);

        // Local Storage Keys
        const STORAGE_KEY = 'coursesList';
        const COMPLETED_KEY = 'completedCoursesList';

        // Elements
        const courseNameInput = document.getElementById('courseNameInput');
        const courseLinkInput = document.getElementById('courseLinkInput');
        const addBtn = document.getElementById('addBtn');
        const courseList = document.getElementById('courseList');
        const completedList = document.getElementById('completedList');

        // Helper: format date to "YYYY-MM-DD HH:mm"
        function formatTimestamp(ts) {
            const d = new Date(ts);
            const pad = n => n < 10 ? '0' + n : n;
            return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
        }

        // Load courses from localStorage
        function loadCourses() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }
        function loadCompleted() {
            const data = localStorage.getItem(COMPLETED_KEY);
            return data ? JSON.parse(data) : [];
        }

        // Save courses to localStorage
        function saveCourses(courses) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(courses));
        }
        function saveCompleted(courses) {
            localStorage.setItem(COMPLETED_KEY, JSON.stringify(courses));
        }

        // Render courses, sorted by lastOpened (descending)
        function renderCourses() {
            let courses = loadCourses();
            courses.sort((a, b) => (b.lastOpened || 0) - (a.lastOpened || 0));
            courseList.innerHTML = '';
            courses.forEach((course, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>
                        ${course.name}
                        <span style="font-size:0.85em; color:#636e72; margin-left:8px;">
                            (${course.lastOpened ? formatTimestamp(course.lastOpened) : 'Never opened'})
                        </span>
                    </span>
                    <span>
                        <a href="${course.link}" target="_blank" title="Go to course" style="margin-right:8px; text-decoration:none; color:#0984e3;" class="open-link">
                            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 20 20" style="vertical-align:middle;">
                                <path fill="currentColor" d="M14.5 2A1.5 1.5 0 0 1 16 3.5V8a1 1 0 1 1-2 0V5.41l-7.3 7.3a1 1 0 0 1-1.4-1.42l7.3-7.29H11a1 1 0 1 1 0-2h3.5ZM4 5a1 1 0 0 1 1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3a1 1 0 1 1 2 0v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h3a1 1 0 1 1 0 2H6Z"/>
                            </svg>
                        </a>
                        <button class="update-btn" title="Update Link" style="margin-right:8px; background:none; border:none; color:#00b894; font-size:1.1rem; cursor:pointer;">&#9998;</button>
                        <button class="complete-btn" title="Mark as Completed" style="margin-right:8px; background:none; border:none; color:#0984e3; font-size:1.2rem; cursor:pointer;">&#10003;</button>
                        <button class="remove-btn" title="Remove">&times;</button>
                    </span>
                `;
                // Remove
                li.querySelector('.remove-btn').onclick = () => {
                    courses.splice(idx, 1);
                    saveCourses(courses);
                    renderCourses();
                };
                // Update Link
                li.querySelector('.update-btn').onclick = () => {
                    const newLink = prompt("Enter new course link:", course.link);
                    if (newLink && newLink.trim()) {
                        courses[idx].link = newLink.trim();
                        saveCourses(courses);
                        renderCourses();
                    }
                };
                // Mark as Completed
                li.querySelector('.complete-btn').onclick = () => {
                    const completed = loadCompleted();
                    completed.push(course);
                    saveCompleted(completed);
                    courses.splice(idx, 1);
                    saveCourses(courses);
                    renderCourses();
                    renderCompleted();
                };
                // Update lastOpened on open-link click
                li.querySelector('.open-link').onclick = function () {
                    courses[idx].lastOpened = Date.now();
                    saveCourses(courses);
                    // Delay to allow link to open before re-render
                    setTimeout(renderCourses, 100);
                };
                courseList.appendChild(li);
            });
        }

        // Render completed courses (no lastOpened needed)
        function renderCompleted() {
            const completed = loadCompleted();
            completedList.innerHTML = '';
            completed.forEach((course, idx) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <span>${course.name}</span>
                    <span>
                        <a href="${course.link}" target="_blank" title="Go to course" style="margin-right:8px; text-decoration:none; color:#0984e3;">
                            <svg xmlns="http://www.w3.org/2000/svg" height="20" width="20" viewBox="0 0 20 20" style="vertical-align:middle;">
                                <path fill="currentColor" d="M14.5 2A1.5 1.5 0 0 1 16 3.5V8a1 1 0 1 1-2 0V5.41l-7.3 7.3a1 1 0 0 1-1.4-1.42l7.3-7.29H11a1 1 0 1 1 0-2h3.5ZM4 5a1 1 0 0 1 1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1v-3a1 1 0 1 1 2 0v3a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3h3a1 1 0 1 1 0 2H6Z"/>
                            </svg>
                        </a>
                        <button class="remove-btn" title="Remove">&times;</button>
                    </span>
                `;
                // Remove from completed
                li.querySelector('.remove-btn').onclick = () => {
                    completed.splice(idx, 1);
                    saveCompleted(completed);
                    renderCompleted();
                };
                completedList.appendChild(li);
            });
        }

        // Add course
        addBtn.onclick = () => {
            const name = courseNameInput.value.trim();
            const link = courseLinkInput.value.trim();
            if (name && link) {
                const courses = loadCourses();
                courses.push({ name, link, lastOpened: null });
                saveCourses(courses);
                courseNameInput.value = '';
                courseLinkInput.value = '';
                renderCourses();
            }
        };

        // Enter key adds course
        [courseNameInput, courseLinkInput].forEach(input => {
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') addBtn.click();
            });
        });

        // Reload page if date changes
        function checkDateAndReload() {
            const today = new Date().toISOString().slice(0,10);
            const lastDate = localStorage.getItem('lastDate');
            if (lastDate && lastDate !== today) {
                localStorage.setItem('lastDate', today);
                location.reload();
            } else if (!lastDate) {
                localStorage.setItem('lastDate', today);
            }
        }
        checkDateAndReload();

        // Initial render
        renderCourses();
        renderCompleted();

        // Optional: update date at midnight and reload
        setInterval(() => {
            checkDateAndReload();
        }, 60 * 1000); // check every minute
    </script>
</body>
</html>
