<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beautiful Animated Form</title>
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
        }
        .form-container {
            background: rgba(255,255,255,0.9);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31,38,135,0.37);
            padding: 40px 30px;
            width: 350px;
            animation: fadeIn 1.2s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-40px);}
            to { opacity: 1; transform: translateY(0);}
        }
        h2 {
            text-align: center;
            color: #4b6cb7;
            margin-bottom: 24px;
            letter-spacing: 1px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 18px;
            border: none;
            border-radius: 8px;
            background: #f0f4f8;
            font-size: 1rem;
            transition: box-shadow 0.3s;
            box-shadow: 0 2px 8px rgba(76, 201, 240, 0.08);
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #74ebd5;
            background: #e6f7ff;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #4b6cb7 0%, #182848 100%);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            box-shadow: 0 4px 16px rgba(76, 201, 240, 0.15);
        }
        button:hover {
            background: linear-gradient(90deg, #182848 0%, #4b6cb7 100%);
            transform: translateY(-2px) scale(1.03);
        }
        .form-container::after {
            content: '';
            display: block;
            position: absolute;
            z-index: -1;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            background: linear-gradient(120deg, #f6d365 0%, #fda085 100%);
            opacity: 0.08;
            animation: bgPulse 3s infinite alternate;
        }
        @keyframes bgPulse {
            from { opacity: 0.08; }
            to { opacity: 0.18; }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Sign Up</h2>
        <form>
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            
            <label for="about">About You</label>
            <textarea id="about" rows="3" placeholder="Tell us about yourself"></textarea>
            
            <button type="submit">Register</button>
        </form>
    </div>
</body>
</html>
